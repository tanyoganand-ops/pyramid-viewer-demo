<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Interactive sandstone pyramid. Move over its stones to open them, drag to rotate."><title>Pyramid - interactive stones</title><style>*{box-sizing:border-box}html,body{margin:0;background:#eee3c8;color:#423a2e;font:14px system-ui}#hero{height:100svh;min-height:580px}header{position:absolute;top:22px;left:24px;right:24px;pointer-events:none}h1{font:normal 30px Georgia;margin:0 0 8px}p{margin:8px 0;line-height:1.5}footer{position:absolute;bottom:20px;left:16px;right:16px;text-align:center}button,a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;margin:4px;border:1px solid #847b6155;border-radius:30px;background:#fff9e8ba;color:inherit;font:inherit;text-decoration:none}@media(max-width:500px){h1{font-size:25px}header{left:20px}footer p{font-size:12px}}</style></head><body><header><h1>Interactive stones</h1><p id="status">Loading the sandstone pyramid...</p><p>Move across the stones to open them.</p></header><div id="hero"></div><footer><button id="reset">Reset view</button><a href="./">Plain viewer</a><p>Drag to rotate · Scroll or pinch to zoom<br>Hover pauses while dragging. Touch: drag to rotate. Hover needs a pointer.</p></footer><script type="module">import{mountPyramidHero}from './2-pyramid-hover-v2.js';window.hero=mountPyramidHero(document.querySelector('#hero'),{transparent:false,onReady:s=>document.querySelector('#status').textContent=s.blocks+' individually shaped stones',onError:e=>document.querySelector('#status').textContent='3D could not load: '+e.message});document.querySelector('#reset').onclick=()=>hero.reset();</script></body></html>
